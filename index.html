<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding: 40px 16px; background: #f2f2f2; }
    .calc { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); width: 280px; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
    button { background: #2a7de1; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #result { font-size: 20px; font-weight: bold; text-align: center; margin-top: 10px; min-height: 28px; }
  </style>
</head>
<body>
  <div class="calc">
    <h2>Calculator</h2>
    <input type="number" id="a" placeholder="First number">
    <select id="op">
      <option value="add">+ Add</option>
      <option value="subtract">− Subtract</option>
      <option value="multiply">× Multiply</option>
      <option value="divide">÷ Divide</option>
    </select>
    <input type="number" id="b" placeholder="Second number">
    <button onclick="calculate()">Calculate</button>
    <div id="result"></div>
  </div>
  <script>
    function calculate() {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      const op = document.getElementById('op').value;
      const out = document.getElementById('result');
      if (isNaN(a) || isNaN(b)) { out.textContent = 'Please enter both numbers'; return; }
      let r;
      if (op === 'add') r = a + b;
      else if (op === 'subtract') r = a - b;
      else if (op === 'multiply') r = a * b;
      else {
        if (b === 0) { out.textContent = 'Cannot divide by zero'; return; }
        r = a / b;
      }
      out.textContent = 'Result: ' + r;
    }
  </script>
</body>
</html>
